# Бот сидит на длинных опросах и не слушает порт -- на Railway это worker,
# входящий домен ему не нужен.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -u bot.py"
# По умолчанию Railway сдаётся после десяти падений подряд. Для бота, который
# должен просто стоять и работать, это не годится: ночь сетевых неурядиц --
# и утром он лежит.
restartPolicyType = "ALWAYS"
